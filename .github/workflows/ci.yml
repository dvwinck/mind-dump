name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  checks:
    name: Auditoria e validacao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # O app nao tem dependencias de producao: este passo bloqueia se alguma for adicionada com falha high+.
      - name: Auditar dependencias de producao (high+)
        run: npm audit --omit=dev --audit-level=high
      # Dependencias de desenvolvimento (vitest/vite) ainda tem avisos abertos: reporta sem bloquear ate atualizar o lockfile.
      - name: Auditar dependencias de desenvolvimento (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Validar manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
